[project]
name = "cosmos-live"
version = "0.1.0"
description = "Intelligent video feed management system for multi-camera live streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cosmos-core",
    "cosmos-storage",
    "cosmos-ingestion",
    "cosmos-control",
    "cosmos-utils",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cosmos-core = { workspace = true }
cosmos-storage = { workspace = true }
cosmos-ingestion = { workspace = true }
cosmos-control = { workspace = true }
cosmos-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]
