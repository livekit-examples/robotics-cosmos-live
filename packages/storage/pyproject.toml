[project]
name = "cosmos-storage"
version = "0.1.0"
description = "Vector store implementations"
requires-python = ">=3.12"
dependencies = [
    "cosmos-core",
    "pymilvus>=2.4",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_storage"]

[tool.uv.sources]
cosmos-core = { workspace = true }
