[project]
name = "cosmos-ingestion"
version = "0.1.0"
description = "Orchestrator and workers for ingesting live video and audio"
requires-python = ">=3.12"
dependencies = [
    "cosmos-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_ingestion"]

[tool.uv.sources]
cosmos-core = { workspace = true }
