[project]
name = "cosmos-utils"
version = "0.1.0"
description = "Shared utilities for Cosmos Live"
requires-python = ">=3.12"
dependencies = [
    "livekit-api>=1.0.0",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_utils"]
