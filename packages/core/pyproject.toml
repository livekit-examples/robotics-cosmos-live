[project]
name = "cosmos-core"
version = "0.1.0"
description = "Core abstractions and interfaces for cosmos-live"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_core"]
