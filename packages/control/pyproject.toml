[project]
name = "cosmos-control"
version = "0.1.0"
description = "LLM agent and RAG pipeline for feed control"
requires-python = ">=3.12"
dependencies = [
    "cosmos-core",
    "cosmos-utils",
    "Pillow>=10.0",
    "livekit>=1.0",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_control"]

[tool.uv.sources]
cosmos-core = { workspace = true }
cosmos-utils = { workspace = true }
