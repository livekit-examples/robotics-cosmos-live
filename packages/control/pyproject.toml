[project]
name = "cosmos-control"
version = "0.1.0"
description = "LLM agent and RAG pipeline for feed control"
requires-python = ">=3.12"
dependencies = [
    "cosmos-core",
]

[build-system]
requires = ["3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_control"]

[tool.uv.sources]
cosmos-core = { workspace = true }
